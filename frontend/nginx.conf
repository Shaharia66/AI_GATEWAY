server {
    listen 80;
    server_name ai-gateway-shs.duckdns.org;

    # Certbot's renewal process needs to reach this path over plain HTTP
    # periodically - don't redirect it, or automatic renewal will break.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else on port 80 gets sent to HTTPS instead.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ai-gateway-shs.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/ai-gateway-shs.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-gateway-shs.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        proxy_pass http://backend:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location / {
        try_files $uri /index.html;
    }
}