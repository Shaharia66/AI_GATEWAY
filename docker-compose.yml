services:
  backend:
    build: ./backend
    container_name: ai-gateway-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      USAGE_DB_PATH: /app/data/usage.db
    volumes:
      - backend_data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: ai-gateway-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mounts the real certificate files from the host VM into the
      # container, read-only - nginx reads them directly, no need to
      # rebuild the image when the cert renews.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  backend_data: