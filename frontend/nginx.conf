server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container over Docker's internal network.
    # "backend" here is the service name from docker-compose.yml, not a
    # public hostname - Docker Compose resolves it automatically.
    location /v1/ {
        proxy_pass http://backend:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Everything else is the React app - this line matters for client-side
    # routing (if you ever add it): unknown paths fall back to index.html
    # instead of nginx returning a 404.
    location / {
        try_files $uri /index.html;
    }
}